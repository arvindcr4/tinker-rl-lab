name: TinkerRL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-research:
    # Deliberately independent of training dependencies, TeX, credentials and GPU access.
    # Verifies the reviewed public snapshot and scientific cross-file contracts;
    # does not replay withheld inference or establish independent scientific validity.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public research release offline
        run: make public-check PYTHON=python

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.11
      - name: Lint with ruff
        run: make lint RUFF=ruff PYTHON=python
      - name: Check formatting
        run: make format-check RUFF=ruff

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.11
          timeout 15m uv sync --locked --extra dev --python python
      - name: Run sharded unit tests
        run: |
          # NOTE: pytest-xdist is not a dependency (pyproject/requirements pin
          # pytest without xdist), so shard by test file over the matrix
          # instead of `pytest -n auto`. If xdist is ever added to the dev
          # extra, prefer `pytest -n auto` and drop this splitter.
          mapfile -t FILES < <(find tests -name 'test_*.py' | sort)
          TOTAL=2
          SHARD=${{ matrix.shard }}
          SELECTED=()
          for i in "${!FILES[@]}"; do
            if [ "$((i % TOTAL))" -eq "$((SHARD - 1))" ]; then
              SELECTED+=("${FILES[$i]}")
            fi
          done
          echo "Shard $SHARD/$TOTAL: ${#SELECTED[@]} files"
          timeout 20m uv run --no-sync pytest "${SELECTED[@]}" -m "not latex" -v --tb=short
      - name: Check current thesis evidence and offline demo
        run: timeout 10m make submission-check
      - name: Test seed utility
        run: timeout 5m uv run --no-sync python -c "from utils.seed import set_global_seed; info = set_global_seed(42); print('Seed set successfully:', info)"
      - name: Test imports
        run: |
          timeout 5m uv run --no-sync python -c "from utils.seed import set_global_seed, get_seed_from_args"
          timeout 5m uv run --no-sync python -c "from utils.stats import bootstrap_ci, compute_iqm"

  docs-build:
    # Native LaTeX audit tests and paper builds run here, not in test-core.
    # Scratch output directories preserve author PDFs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install audit test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.11
          timeout 15m uv sync --locked --extra dev --python python
      - name: Install checksum-pinned Tectonic
        env:
          TECTONIC_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          TECTONIC_SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl --fail --location --retry 3 "$TECTONIC_URL" -o "$RUNNER_TEMP/tectonic.tar.gz"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tex-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tex-bin" tectonic
          echo "$RUNNER_TEMP/tex-bin" >> "$GITHUB_PATH"
      - name: Compile papers to a scratch outdir
        working-directory: platform_tinker/reports/final
        run: |
          mkdir -p "$RUNNER_TEMP/latex-audit"
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper_anonymous.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" supplementary_appendix.tex
      - name: Run native LaTeX audit integration tests
        run: timeout 10m uv run --no-sync pytest tests/ -m latex -v --tb=short

  legacy-scripts:
    # Root one-shot drivers (train_grpo_test.py, train_test_idpo.py,
    # verify_*.py) import heavy model weights at module scope, so CI must
    # never import or execute them. This job byte-compiles them only:
    # no imports run, no weights download. Their bodies are intentionally
    # untouched; this job config is the entire CI coverage for them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile-check heavy root drivers (no imports, no weights)
        run: timeout 5m python -m py_compile train_grpo_test.py train_test_idpo.py verify_*.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel from locked metadata
        run: |
          pip install uv==0.10.11
          uv lock --check
          uv build --wheel
      - name: Verify wheel contents
        run: python tools/check_wheel.py dist/*.whl

  test-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch gymnasium
          # sb3_ppo_math.py imports stable_baselines3 at module scope,
          # so it must be available even for the env-only smoke test.
          pip install "stable-baselines3>=2.1.0"
          pip install -e "."
      - name: Test ArithmeticEnv (SB3 version)
        run: |
          timeout 10m python -c "
          import sys, os
          sys.path.insert(0, '.')
          # Execute the module's top section (up to the first def main)
          # providing a real __file__ so the module's own sys.path.insert
          # logic works when pulled in via exec().
          src_path = os.path.abspath('platform_hybrid/experiments/implementations/sb3_ppo_math.py')
          src = open(src_path).read().split('def main')[0]
          ns = {'__file__': src_path, '__name__': '__main__'}
          exec(compile(src, src_path, 'exec'), ns)
          ArithmeticEnv = ns['ArithmeticEnv']
          env = ArithmeticEnv(max_num=99)
          obs, _ = env.reset(seed=42)
          assert obs.shape == (2,), f'Expected shape (2,), got {obs.shape}'
          action = int(obs[0] + obs[1])
          _, reward, done, _, info = env.step(action)
          print(f'Env test passed: obs={obs}, reward={reward}, correct={info[\"correct\"]}')
          "

  reproducibility-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch gymnasium
      - name: Verify seed determinism
        run: |
          timeout 5m python -c "
          import sys
          sys.path.insert(0, '.')
          from utils.seed import set_global_seed
          import numpy as np
          import torch
          
          # Run 1
          set_global_seed(42)
          r1_np = np.random.random(10).tolist()
          r1_torch = torch.randn(10).tolist()
          
          # Run 2 (same seed)
          set_global_seed(42)
          r2_np = np.random.random(10).tolist()
          r2_torch = torch.randn(10).tolist()
          
          assert r1_np == r2_np, 'NumPy seed not deterministic!'
          assert r1_torch == r2_torch, 'PyTorch seed not deterministic!'
          print('Reproducibility check PASSED')
          "

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check required documentation
        run: |
          for f in README.md LICENSE REPRODUCE.md BASELINES.md CONTRIBUTING.md SECURITY.md ARTIFACT.md; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done
          echo "All required documentation files present"
      - name: Check experiment implementations exist
        run: |
          count=$(ls platform_hybrid/experiments/implementations/*.py 2>/dev/null | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "ERROR: Expected at least 5 experiment implementations, found $count"
            exit 1
          fi
          echo "Found $count experiment implementations"

  minreport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install signature verifier
        run: pip install cryptography==49.0.0
      - name: Verify provenance records
        run: |
          for f in platform_hybrid/registry/provenance/*.provenance.json; do
            if [ -f "$f" ]; then
              echo "Verifying $f..."
              python platform_hybrid/registry/provenance/minreport.py verify "$f" --strict
            fi
          done
          for sig in platform_hybrid/registry/provenance/*.provenance.json.sig; do
            if [ -f "$sig" ]; then
              record="${sig%.sig}"
              echo "Verifying detached signature for $record..."
              python platform_hybrid/registry/provenance/sign.py verify "$record"
            fi
          done
