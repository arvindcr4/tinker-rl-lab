name: TinkerRL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-research:
    # Deliberately independent of training dependencies, TeX, credentials and GPU access.
    # Verifies the reviewed public snapshot and scientific cross-file contracts;
    # does not replay withheld inference or establish independent scientific validity.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public research release offline
        run: make public-check PYTHON=python

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint with ruff
        run: make lint RUFF=ruff PYTHON=python
      - name: Check formatting
        run: make format-check RUFF=ruff

  quality:
    # Type check, coverage gate (fail_under in .coveragerc) and lock freshness.
    # Separate from test-core because coverage must see the whole suite, not a shard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Number-audit claims verify historical tagged commits.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.11
          # cleanrl currently adds only the locked TensorBoard dependency.
          # Exercise real native event-file parsing instead of skipping it.
          timeout 15m uv sync --locked --extra dev --extra cleanrl --python python
      - name: Type check (mypy)
        run: timeout 5m make typecheck
      - name: uv.lock and requirements-lock.txt are fresh
        run: timeout 5m make lock-check
      - name: Install checksum-pinned Tectonic
        env:
          TECTONIC_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          TECTONIC_SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl --fail --location --retry 3 "$TECTONIC_URL" -o "$RUNNER_TEMP/tectonic.tar.gz"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tex-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tex-bin" tectonic
          echo "$RUNNER_TEMP/tex-bin" >> "$GITHUB_PATH"
      - name: Compile papers to a scratch outdir
        working-directory: platform_tinker/reports/final
        run: |
          mkdir -p "$RUNNER_TEMP/latex-audit"
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper_anonymous.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" supplementary_appendix.tex
      - name: Coverage gate
        run: timeout 20m make coverage

  secret-scan:
    # Scans only the pushed / PR commit range, so the two historical Tinker keys
    # (pending rotation) do not block CI; `make secrets-history` scans everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          # Official v8.30.1 release checksums.txt, linux_x64 asset.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE..$HEAD_SHA"
          elif git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
            RANGE="$PUSH_BEFORE..$HEAD_SHA"
          else
            RANGE="-1 $HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE" .

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Number-audit claims verify historical tagged commits.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.11
          timeout 15m uv sync --locked --extra dev --python python
      - name: Run sharded unit tests
        run: |
          # NOTE: pytest-xdist is not a dependency (pyproject/requirements pin
          # pytest without xdist), so shard by test file over the matrix
          # instead of `pytest -n auto`. If xdist is ever added to the dev
          # extra, prefer `pytest -n auto` and drop this splitter.
          mapfile -t FILES < <(find tests -name 'test_*.py' | sort)
          TOTAL=2
          SHARD=${{ matrix.shard }}
          SELECTED=()
          for i in "${!FILES[@]}"; do
            if [ "$((i % TOTAL))" -eq "$((SHARD - 1))" ]; then
              SELECTED+=("${FILES[$i]}")
            fi
          done
          echo "Shard $SHARD/$TOTAL: ${#SELECTED[@]} files"
          timeout 20m uv run --no-sync pytest "${SELECTED[@]}" -m "not latex"
      - name: Check current thesis evidence and offline demo
        run: timeout 10m make submission-check

  docs-build:
    # Native LaTeX audit tests and paper builds run here, not in test-core.
    # Scratch output directories preserve author PDFs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install audit test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.11
          timeout 15m uv sync --locked --extra dev --python python
      - name: Install checksum-pinned Tectonic
        env:
          TECTONIC_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          TECTONIC_SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl --fail --location --retry 3 "$TECTONIC_URL" -o "$RUNNER_TEMP/tectonic.tar.gz"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tex-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tex-bin" tectonic
          echo "$RUNNER_TEMP/tex-bin" >> "$GITHUB_PATH"
      - name: Compile papers to a scratch outdir
        working-directory: platform_tinker/reports/final
        run: |
          mkdir -p "$RUNNER_TEMP/latex-audit"
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" grpo_agentic_llm_paper_anonymous.tex
          timeout 10m tectonic -X compile --outdir "$RUNNER_TEMP/latex-audit" supplementary_appendix.tex
      - name: Run native LaTeX audit integration tests
        run: timeout 10m uv run --no-sync pytest tests/ -m latex

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and verify wheel from locked metadata
        run: |
          pip install uv==0.10.11
          make package PYTHON=python

  test-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch gymnasium pytest
          # sb3_ppo_math.py imports stable_baselines3 at module scope,
          # so it must be available even for the env-only smoke test.
          pip install "stable-baselines3>=2.1.0"
          pip install -e "."
      - name: Test ArithmeticEnv (SB3 version)
        run: |
          python -m pytest tests/test_arithmetic_env_contract.py -q

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check required documentation
        run: make docs-check
      - name: Check experiment implementations exist
        run: |
          count=$(ls platform_hybrid/experiments/implementations/*.py 2>/dev/null | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "ERROR: Expected at least 5 experiment implementations, found $count"
            exit 1
          fi
          echo "Found $count experiment implementations"

  minreport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install signature verifier
        run: pip install cryptography==49.0.0
      - name: Verify provenance records
        run: |
          python platform_hybrid/registry/provenance/verify_inventory.py
