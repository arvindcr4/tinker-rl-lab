# gitleaks configuration (gitleaks >= 8.25 for [[allowlists]] / targetRules).
#
#   working tree : gitleaks dir --config .gitleaks.toml --redact .
#   staged diff  : gitleaks git --pre-commit --staged --config .gitleaks.toml --redact .
#   full history : gitleaks git --log-opts=--all --config .gitleaks.toml --redact .
#
# Uses the upstream default ruleset; every allowlist below is a reviewed false
# positive with its reason. Allowlists are scoped to the generic-api-key rule
# (the only rule that fired) so provider-specific rules (hf_, tml-, sk-, AWS,
# GitHub, Slack, ...) still fire everywhere.
#
# WARNING (security): two real Tinker API keys (tml-...) are in git history
# (experiments/run_tinker.sh @18e5a445b, reports/final/run_heldout_parallel.sh
# @eaff8c95a/a721caa02) on a PUBLIC repo. They are deliberately NOT
# allowlisted: rotate them, then record their fingerprints in .gitleaksignore.

title = "tinker-rl-lab gitleaks config"

[extend]
useDefault = true

# BibTeX keys such as zhang2025scaffgrpo / schulman2017proximal.
[[allowlists]]
description = "bibtex citation keys"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^[a-z]+(?:19|20)\d{2}[a-z]+$''']

# Python type annotations: `private_key: Ed25519PrivateKey | None`.
[[allowlists]]
description = "type annotations naming a key class, not a key value"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''_key:\s*Ed25519PrivateKey\b''']

# Throwaway Ed25519 seeds used only to sign test trust roots inside the
# unit tests; their public halves are not pinned anywhere in the repo
# (verified with git grep on raw/hex/b64 public keys), so they grant nothing.
[[allowlists]]
description = "unit-test-only Ed25519 signing seeds"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^zvf-program/flagship/test_pavlov_[a-z]+_eval_adapter\.py$''']
regexTarget = "line"
regexes = ['''_E\d+_TEST_PRIVATE_KEY_B64 = "''']

# Benchmark prompt text (agent-safety phishing emails "use the following
# encryption key: ..."), upstream code echoed in tool transcripts, and Modal
# web-endpoint 303 redirect attempt tokens (ephemeral, single function call).
[[allowlists]]
description = "benchmark prompt content and ephemeral Modal redirect tokens in eval logs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^outputs/''']
regexTarget = "line"
regexes = [
  '''use the following encryption key''',
  '''posthog_client_key = ''',
  '''__modal_attempt_token=''',
]

[[allowlists]]
description = "literal controller lookup label, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform_modal/scripts/p5p8/p7_n10_replication\.py$''']
regexTarget = "line"
regexes = ['''^\s*key_070 = "zvf_triage_0\.7"\s*$''']

[[allowlists]]
description = "literal validation error text, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^finish/progress_reporting_audit/generate_v1\.py$''']
regexTarget = "line"
# Ruff normalizes the quote style; retain the exact literal and statement shape.
regexes = ['''^\s*need\(key in task_ids and key not in reports, (?:'foreign/duplicate native SWE task'|"foreign/duplicate native SWE task")\)\s*$''']

[[allowlists]]
description = "verified tokenizer artifact SHA-256, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^reports/runtime_followup_2026-10-11/GSM8K_TOKEN_BUDGET_AUDIT\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer_sha256": "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4",\s*$''']
