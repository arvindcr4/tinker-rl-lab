repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # `make lint-ruff` lints the same files as CI. A bare repo-wide
        # `ruff check` instead flags archived/exploratory experiment trees that
        # are deliberately outside the supported surface (see Makefile
        # RUFF_PATHS and [tool.ruff] in pyproject.toml).
        entry: make lint-ruff
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        # Mirror `make format-check` so the local hook checks the same file list
        # as CI. Running `ruff format --check` over every tracked file flags the
        # exploratory trees that `[tool.ruff.format].exclude` deliberately
        # leaves as the author wrote them (they are not part of `make check`).
        entry: make format-check
        language: system
        pass_filenames: false
      - id: focused-tests
        name: focused unit tests
        entry: uv run --no-sync pytest -q tests/
        language: system
        pass_filenames: false
      - id: repository-policy
        name: repository policy
        entry: python3 tools/check_repo_policy.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy (typed surface in mypy.ini)
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]
      - id: lock-check
        name: uv.lock / requirements-lock.txt freshness
        entry: make lock-check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements-lock\.txt)$
  # Secret scan of staged changes only (fast). Allowlists live in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml", "--redact"]
