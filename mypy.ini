# mypy gate for the typed surface: utils/, tools/, provenance minreport.
# Run: make typecheck  (== uv run --no-sync mypy)
# CI and pyproject require Python >= 3.11, so check against 3.11.
[mypy]
python_version = 3.11
files = utils, tools, platform_hybrid/registry/provenance/minreport.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
show_error_codes = True
# tools/ is a script directory, not a package: scripts that support both
# `python tools/x.py` and package import guard `from . import` behind
# `if __package__:`. Treat that branch as dead so mypy checks the script path.
always_false = __package__

# --- Third-party modules without stubs / py.typed (scoped, not global) ---
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-rliable.*]
ignore_missing_imports = True

# Optional publication-analysis / CPU-refit dependencies may be absent from the
# core dev environment and do not consistently distribute type information.
# Keep their first-party callers type-checked.
[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-tinker.*]
ignore_missing_imports = True

# Optional training extra: core/dev CI intentionally does not install TRL.
# utils.seed catches ImportError when reporting its version.
[mypy-trl.*]
ignore_missing_imports = True

# The frozen parser is hash-bound by the October 3 publication manifest.
# Its optional `source` annotation is retained without rewriting frozen evidence;
# scope this exception to that module and error code, not the public package.
[mypy-research.public_analysis.parser_v2]
disable_error_code = arg-type
