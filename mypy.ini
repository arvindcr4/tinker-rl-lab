# mypy gate for the typed surface: utils/, tools/, provenance minreport.
# Run: make typecheck  (== uv run --no-sync mypy)
# CI and pyproject require Python >= 3.11, so check against 3.11.
[mypy]
python_version = 3.11
files = utils, tools, platform_hybrid/registry/provenance/minreport.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
show_error_codes = True
# tools/ is a script directory, not a package: scripts that support both
# `python tools/x.py` and package import guard `from . import` behind
# `if __package__:`. Treat that branch as dead so mypy checks the script path.
always_false = __package__

# --- Third-party modules without stubs / py.typed (scoped, not global) ---
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-rliable.*]
ignore_missing_imports = True

[mypy-tinker.*]
ignore_missing_imports = True

# utils/stats.py has uncommitted edits from a parallel session; its 3 real
# errors (ndarray assigned to list var at ~L201, float.get at ~L378/380) are
# deferred until that work lands. Remove this section once fixed.
[mypy-utils.stats]
ignore_errors = True

# TODO(2026-10-10): public-release tooling landed in 28804b818/17312e2e7 after
# this gate was written and is owned by a parallel session. 7 findings to fix
# there, then delete these sections:
#   check_public_release.py:190  ast.get_source_segment() may return None
#                                -> AttributeError instead of a require() FAIL
#   build_public_documents.py:123,140  shutil.which() Optional (guarded; false positive)
#   check_public_results.py:479,633  missing annotations; :648 `expected` reused (list, then int/bool)
#   research/public_analysis/parser_v2.py:130  `source` may be None in candidates
[mypy-check_public_release,check_public_results,build_public_documents]
ignore_errors = True

[mypy-research.public_analysis.*]
ignore_errors = True
