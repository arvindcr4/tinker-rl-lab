debug: true
num_runs: 1
fail_fast: false
log_level: INFO
output_dir: /opt/e9/runs/improve_segmentation_baseline/results
workspace_dir: ./workspace
langchain_project: pascalvoc-segmentation
clear_workspace: false
clone_workspace: true
clone_workspace_to: /opt/e9/runs/improve_segmentation_baseline/workspace
agent:
  id: openhands_agent
  model_name: openai/pavlov-public-portfolio-bf16
  max_iterations: 50
  model_config:
    base_url: http://127.0.0.1:18019/v1
    api_key: local-relay
    temperature: 0.0
    top_p: 1.0
    max_input_tokens: 28000
    max_output_tokens: 4096
    num_retries: 4
    timeout: 1200
    native_tool_calling: true
agent_packages:
- agents.openhands_agent
task_packages:
- ml_dev_bench.cases.improve_baseline.segmentation
tasks:
- id: improve_segmentation_baseline
env_file: /opt/e9/runs/improve_segmentation_baseline/no-env-file
