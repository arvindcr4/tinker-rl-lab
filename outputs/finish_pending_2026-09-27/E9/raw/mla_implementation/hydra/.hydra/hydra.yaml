hydra:
  run:
    dir: /opt/e9/runs/mla_implementation/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/opt/e9/runs/mla_implementation/hydra
    - hydra.mode=RUN
    task:
    - task=mla_implementation
    - agent=openhands
    - agent.model_name=openai/pavlov-public-portfolio-bf16
    - +agent.max_iterations=50
    - +agent.model_config.base_url=http://127.0.0.1:18019/v1
    - +agent.model_config.api_key=local-relay
    - +agent.model_config.temperature=0.0
    - +agent.model_config.top_p=1.0
    - +agent.model_config.max_input_tokens=28000
    - +agent.model_config.max_output_tokens=4096
    - +agent.model_config.num_retries=4
    - +agent.model_config.timeout=1200
    - +agent.model_config.native_tool_calling=true
    - output_dir=/opt/e9/runs/mla_implementation/results
    - clone_workspace_to=/opt/e9/runs/mla_implementation/workspace
    - +env_file=/opt/e9/runs/mla_implementation/no-env-file
  job:
    name: run_hydra_evaluation
    chdir: null
    override_dirname: +agent.max_iterations=50,+agent.model_config.api_key=local-relay,+agent.model_config.base_url=http://127.0.0.1:18019/v1,+agent.model_config.max_input_tokens=28000,+agent.model_config.max_output_tokens=4096,+agent.model_config.native_tool_calling=true,+agent.model_config.num_retries=4,+agent.model_config.temperature=0.0,+agent.model_config.timeout=1200,+agent.model_config.top_p=1.0,+env_file=/opt/e9/runs/mla_implementation/no-env-file,agent.model_name=openai/pavlov-public-portfolio-bf16,agent=openhands,clone_workspace_to=/opt/e9/runs/mla_implementation/workspace,output_dir=/opt/e9/runs/mla_implementation/results,task=mla_implementation
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /opt/e9/controller
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /opt/e9/controller/ml_dev_bench/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /opt/e9/runs/mla_implementation/hydra
    choices:
      task: mla_implementation
      agent: openhands
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
