# smoke test: Qwen3.5-4B, v2 (6-level shaped) reward, 2 steps, tiny batch
# v2 reward is designed to break ZVF saturation (within-group score variance)
# validates 3-process stack + Tinker round-trip + a non-empty gradient step
env:
  group_size: 8
  batch_size: 16
  max_batches_offpolicy: 2
  tokenizer_name: "Qwen/Qwen3.5-4B"
  use_wandb: true
  rollout_server_url: "http://localhost:18000"
  wandb_name: "smoke-qwen3_4b-v2-env"
  ensure_scores_are_not_same: false
  max_token_length: 768
  max_num_workers: 8
  total_steps: 2
  steps_per_eval: 1
  data_seed: 42

openai:
  - model_name: "Qwen/Qwen3.5-4B"
    base_url: "http://localhost:8001/v1"
    api_key: "x"
    weight: 1.0
    num_requests_for_eval: 20

tinker:
  lora_rank: 16
  learning_rate: 5e-5
  max_token_trainer_length: 1024
  checkpoint_dir: "./checkpoints/tool_use_zvf_sweep/smoke_qwen3_4b_v2/"
  save_checkpoint_interval: 0
  tinker_model_name: "Qwen/Qwen3.5-4B"
  wandb_project: "tinker-rl-zvf-counterfactual"
  wandb_group: "smoke"
  wandb_run_name: "smoke-qwen3_4b-v2"

slurm: false
testing: false
