[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkerrl"
version = "0.1.0"
description = "TinkerRL: A Reproducible Multi-Library Reinforcement Learning Benchmark Suite"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "PES LLM Research Team", email = "arvindcr4@gmail.com"},
]
keywords = [
    "reinforcement-learning",
    "benchmark",
    "reproducibility",
    "deep-learning",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # E1 frozen-runtime lock (see execution-notes.md); pinned for reproducibility.
    "numpy==2.2.6",
    "torch==2.7.1",
    "transformers==5.5.4",
    "datasets==4.8.4",
    "huggingface-hub==1.11.0",
    "wandb==0.21.0",
    "gymnasium==1.2.3",
    "tinker==0.24.1",
    "codecarbon==3.2.8",
    "pydantic>=2.13.0,<3.0.0",
]

[project.scripts]
tinkerrl = "platform_local.unified.__main__:main"

[project.optional-dependencies]
trl = [
    "transformers==5.5.4",
    "trl==1.2.0",
    "datasets==4.8.4",
    "peft==0.19.1",
    "accelerate==1.13.0",
]
sb3 = [
    "stable-baselines3>=2.8.0,<3.0.0",
]
cleanrl = [
    "tensorboard>=2.14.0",
]
tianshou = [
    "tianshou>=2.0.0,<2.1.0",
]
d3rlpy = [
    "d3rlpy>=2.8.0,<2.9.0",
]
eval = [
    "fschat==0.2.36",
    "openai==2.45.0",
]
all = [
    "accelerate==1.13.0",
    "d3rlpy>=2.8.0,<2.9.0",
    "fschat==0.2.36",
    "openai==2.45.0",
    "peft==0.19.1",
    "stable-baselines3>=2.8.0,<3.0.0",
    "tensorboard>=2.14.0",
    "tianshou>=2.0.0,<2.1.0",
    "trl==1.2.0",
]
dev = [
    "types-jsonschema>=4.23,<5",
    "jsonschema>=4.23,<5",  # publication registry validation regressions
    "build>=1.2",
    "pytest>=9.1.0,<10.0.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",  # property tests (tests/test_properties_*.py)
    "ruff>=0.1.0",
    "mypy>=2.4,<3",  # match the locked version so `make typecheck` == CI
    "pre-commit>=3.0",
    # Required so `utils.stats` can be imported by the test-core job
    # (utils/stats.py uses pandas / matplotlib / seaborn for the
    # per-experiment analysis tooling).
    "pandas>=2.3.0,<2.4.0",
    "matplotlib>=3.11.0,<4.0.0",
    "scipy>=1.17.0,<2.0.0",
    "seaborn>=0.13.0,<0.14.0",
    "scikit-learn>=1.7,<2",  # reviewed analysis regressions import sklearn
    "tenacity>=9,<10",  # offline provider-adapter imports during collection
    "fastapi>=0.142.0,<0.143.0",  # offline Atropos and actor HTTP contract tests
    "httpx>=0.28.1,<0.29.0",  # FastAPI/Starlette TestClient transport
]

[project.urls]
Homepage = "https://github.com/pes-llm-research/tinker-rl-lab"
Documentation = "https://github.com/pes-llm-research/tinker-rl-lab/blob/main/README.md"
Repository = "https://github.com/pes-llm-research/tinker-rl-lab"
Issues = "https://github.com/pes-llm-research/tinker-rl-lab/issues"

[tool.setuptools.packages.find]
# First-party Python packages only. Vendored / integration subtrees
# Supported reusable modules are packaged. Vendored framework integrations and
# exploratory trees stay source-only because they have independent runtimes.
include = [
    "platform_local",
    "platform_local.trl_integrations*",
    "platform_local.unified*",
    "platform_tinker",
    "platform_tinker.tinkerrl*",
    "utils*",
]
exclude = [
    "atropos*", "verl*", "openrlhf*", "skyrl*",
    "agentic-rl-finetuning*", "ai-scientist-template*",
    "research_loop*", "capstone-literature-survey*", "huggingface*",
    "tests*", "paper*", "reports*", "experiments*", "scripts*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Honor explicit formatter exclusions even when a command names a frozen file.
force-exclude = true
extend-exclude = [
    # Vendored / upstream integrations — not authored by this project.
    "atropos",
    "verl",
    "openrlhf",
    "skyrl",
    "agentic-rl-finetuning",
    "ai-scientist-template",
    "research_loop",
    "capstone-literature-survey",
    "huggingface",
    # Generated / archived notebooks & result files.
    "*.ipynb",
    "paper/tikz",
    "experiments/collab-results",
    "experiments/modal",
    "experiments/tinker-runs",
    "experiments/10x_structural_ceiling",
    "experiments/notebooks",
    "reports/final",
    "grpo_ablation_results",
]

[tool.ruff.lint]
# Keep the bug-finding checks (F401 unused import, F811 redefinition,
# F821 undefined name) enabled globally so they continue to flag real
# issues in first-party code (``utils/``, ``tests/``, top-level modules).
# Noisy exploratory-code paths (``scripts/**``, ``experiments/**``) scope
# only unused imports via ``per-file-ignores`` below; vendored trees are
# excluded entirely via ``extend-exclude`` above.
# Bug-finding + security on top of the original F/W/I/UP031 gate:
#   B = flake8-bugbear, S = flake8-bandit, PIE = misc anti-patterns,
#   PT = pytest style (only fires on tests), RUF100 = stale ``# noqa``,
#   RET505 = superfluous else-after-return.
# Broader UP (UP006/UP045, PEP 585/604 annotations) is deliberately NOT enabled:
# annotation modernization is a separate migration from bug-finding checks.
select = ["F", "W", "I", "UP031", "B", "S", "PIE", "PT", "RUF100", "RET505"]
ignore = [
    "E501",   # line length — handled by formatter if at all
    "F541",   # f-string without placeholders — used for multi-line format strings
    "F841",   # unused local (research scripts set aside intermediates)
    "W291",   # trailing whitespace (autofixable; CI should not block on it)
    "W293",   # blank line with whitespace
    "I001",   # unsorted imports (let contributors organize imports their way)
    "S311",   # random/np.random for seeded RL sampling + bootstrap, never crypto
    "S603",   # subprocess with argv list (no shell); fires on every call, no signal
    "S607",   # partial executable path (git/uv/python/latexmk resolved via PATH by design)
]

[tool.ruff.lint.per-file-ignores]
# Exploratory scripts may retain unused imports, but undefined names and
# redefinitions are checked in executable first-party research code too.
"scripts/**/*.py"      = ["F401"]
"experiments/**/*.py"  = ["F401"]
"paper/figures/**/*.py" = ["F401"]
# Top-level GRPO research drivers (one-shot scripts, not reusable library
# code; they keep exploratory imports deliberately).
"grpo_*.py"            = ["F401"]
# Tests: bare ``assert`` is how pytest works; unittest.TestCase assert* methods
# are a legitimate style in this suite; fake tokens/secrets are fixtures.
"tests/**/*.py" = ["S101", "PT009", "PT011", "PT027", "S105", "S106", "S108", "S310", "S112"]
# 2026-10-18: pytest-style trees that live outside ``tests/``. Bare asserts and
# unittest-style assertions are the test idiom there, as in ``tests/``; temp
# files, shell=False subprocess arguments and fixture tokens are test fixtures.
"**/test_*.py" = ["S101", "PT009", "PT011", "PT027", "S105", "S106", "S108", "S310", "S112"]
"**/*_test.py" = ["S101", "PT009", "PT011", "PT027", "S105", "S106", "S108", "S310", "S112"]
"**/tests/**/*.py" = ["S101", "PT009", "PT011", "PT027", "S105", "S106", "S108", "S310", "S112"]
"**/tests_*.py" = ["S101", "PT009", "PT011", "PT027", "S105", "S106", "S108", "S310", "S112"]
# One-shot research scripts ran on Colab/Modal: a star-import of a shared config
# module is how they pick up MODEL/prompt/knob constants, and asserts guard
# expected input shapes. Neither is a library-quality concern. Literals named
# schema_pass / pass_fail are labels, not credentials (S105 false positives).
"platform_modal/scripts/**/*.py" = ["F405", "S101", "S310", "S110", "S112", "S108", "S102", "S324", "S103", "S104", "B007", "B023", "B005", "B904", "UP031", "S105", "B008"]
"platform_colab/**/*.py" = ["F405", "S101", "S310", "S110", "S112", "S108", "S105", "S106", "S102", "S324", "S103", "B007", "B023", "S602", "B008"]
# Local report/anonymization builders: assert-guarded pipelines, deliberate
# swallow-and-continue when a probe file is absent, pptx constant defaults.
"platform_local/**/*.py" = ["S101", "S110", "S112", "S108", "B008"]
"platform_tinker/reports/**/*.py" = ["S101", "S110", "S112", "S108", "B007", "B023", "B008"]
"platform_hybrid/sem 4 work/**/*.py" = ["S101", "S110", "S112", "B008"]
"platform_hf_spaces/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S105", "S106", "S102", "S324", "S103", "S314", "S104", "B007", "B023", "B904", "B905", "B005", "UP031", "B008"]
# Report generators and verification tools: YAML companion files are trusted
# local inputs (S506), asserts are failure reporting, and scratch paths are
# fixed tool outputs.
"reports/**/*.py" = ["S101", "S506", "S108", "S110", "S112", "B023", "B007", "B008"]
"papers/**/*.py" = ["S101", "S108", "S110", "S112", "B023", "B007"]
"platform_hybrid/experiments/tinker-runs/**/*.py" = ["F405", "S101", "S310", "S110", "S112", "S108"]
# Submission/claim verification scripts exit non-zero on a failed assert.
"zvf-program/flagship/paper/**/*.py" = ["S101"]
"zvf-program/flagship/build_submission.py" = ["S101"]
"zvf-program/audit/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S324", "S105", "S106", "S102", "S103", "B023", "B017"]
# Every zvf-program file is an eval adapter or verification script: assert-based
# contracts, and the same one-shot runner allowances as the flagship evals.
"zvf-program/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S324", "S105", "S106", "S102", "S103", "B023", "B017", "B904", "B905", "B007", "B005", "UP031", "B008", "B018", "F401", "PT012", "PT017"]
# Colab/Modal-style eval runners: urlopen on operator-supplied inputs, optional
# probe blocks that swallow failures, /tmp scratch dirs, and hashlib for cache
# keys — all deliberate in one-shot remote jobs.
"zvf-program/e1_wave10/*.py" = ["S310", "S110", "S112", "S108", "S324"]
"zvf-program/flagship/*.py" = ["S310", "S110", "S112", "S108", "S324", "S105", "S106", "S102", "B023", "B017"]
"zvf-program/flagship/pilot/*.py" = ["S310", "S110", "S112", "S108", "S324", "S105", "S106", "S102", "S103", "B023", "B017"]
# Operator ledger tool: asserts are its failure mode; closures over loop cells are
# intended (each record callback is consumed before the next iteration).
"tools/review_ledger/**/*.py" = ["S101", "B023", "B007", "B008", "B904", "B905", "S105", "S112", "PT018"]
# Frozen archive and agent-skill scripts: kept verbatim for provenance; not
# maintained code and excluded from formatting was not previously requested, so
# lint is silenced here rather than rewriting snapshots.
"archive/**/*.py" = ["B007", "B023", "B904", "S108", "S110", "S310", "S314"]
# Experiment runners: one-shot remote jobs. urlopen on operator paths, probe
# blocks that ignore failures, /tmp scratch, and fnmatch-style hashing are
# deliberate; scratch exports under outputs/ are frozen snapshots.
"platform_hybrid/experiments/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S105", "S106", "S102", "S324", "S103", "S314", "B007", "B023", "B904", "B905", "B005", "UP031", "S506", "B008"]
"outputs/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S105", "S106", "S102", "S324", "S103", "S314", "B007", "B023", "B904", "B905", "B005", "UP031"]
"submission/demo/**/*.py" = ["S101", "S310", "S110", "S112", "S108", "S105", "S106", "S102", "S324", "S103", "S314", "B007", "B023", "B904", "B905", "B005", "UP031"]
# The flat zvf-program copies above are superseded by the umbrella rule.
".claude/skills/**/*.py" = ["B007", "B023", "B904", "S108", "S110", "S310", "S314"]
# TODO(2026-10-03): fix after pydantic migration lands (B010 grpo.py:1209
# setattr constant; RUF100 grpo.py:1713 stale ``noqa: F811``).
"platform_tinker/tinkerrl/grpo.py" = ["B010", "RUF100"]
# TODO(2026-10-03): file has another session's uncommitted edits; fix
# B002 false positive (``-(-1.0)``, :370) and B023 (spy closure, :1299-1300).
"tests/test_grpo_module.py" = ["B002", "B023"]
# TODO(2026-10-03): file has another session's uncommitted edits; S110
# try/except/pass at :768,:773 (unparseable manifest treated as empty).
"tools/apply_antivibe.py" = ["S110"]

[tool.ruff.format]
# Keep exploratory scripts outside routine formatting.
exclude = [
    "experiments/**",
    "scripts/**",
    # Exact source spans are committed in public_analysis/PROVENANCE.json.
    # Keep lint enabled; these historical definitions cannot be reformatted.
    "research/public_analysis/parser_review_historical_v1.py",
    "research/public_analysis/parser_v1.py",
    "research/public_analysis/parser_v2.py",
    "research/public_analysis/parser_v3.py",
    "research/public_analysis/reference_grader.py",
    "research/public_analysis/rescue_statistics_historical_v1.py",
    "research/public_analysis/selection.py",
    "research/public_analysis/statistics.py",
    # This complete file is bound by the inert RLHF follow-up contract.
    "zvf-program/flagship/pilot/objective.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "latex: integration tests requiring a native TeX toolchain (pdflatex/bibtex or cached Tectonic)",
]
